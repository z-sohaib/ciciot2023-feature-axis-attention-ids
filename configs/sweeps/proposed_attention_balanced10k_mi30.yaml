program: scripts/run_wandb_trial.py
method: bayes
metric:
  name: macro_f1
  goal: maximize
command:
  - ${env}
  - .\.venv\Scripts\python.exe
  - ${program}
  - --base-config=configs/proposed_feature_attention_balanced10k_mi30.toml
  - --group=proposed_attention_balanced10k_mi30
  - ${args}
parameters:
  model.conv_channels:
    values: [32, 48, 64, 96]
  model.lstm_hidden:
    values: [64, 96, 128, 160]
  model.attention_heads:
    values: [2, 4, 8]
  model.dense_hidden:
    values: [96, 128, 192, 256]
  model.dropout:
    min: 0.10
    max: 0.40
  training.learning_rate:
    distribution: log_uniform_values
    min: 0.0002
    max: 0.003
  training.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.001
  training.batch_size:
    values: [256, 512, 768]
  training.loss:
    values: ["cross_entropy", "focal"]
  training.focal_gamma:
    values: [1.0, 1.5, 2.0, 2.5]
  training.label_smoothing:
    values: [0.0, 0.02, 0.05]
  training.class_weight:
    values: [false, true]
  training.early_stopping_patience:
    values: [6, 8, 10]
