[experiment]
name = "ciciot2023_proposed_feature_attention_balanced10k_mi30_focal"
seed = 42

[data]
raw_path = "data/raw"
label_column = ""
target_granularity = "category"
max_rows_per_class = 10000
sample_strategy = "stratified_random"
processed_path = "data/processed/category_balanced10000_mi30_seed42.npz"
test_size = 0.20
val_size = 0.15
drop_columns = []

[preprocessing]
variance_threshold = 0.0
feature_selection = "mutual_info"
feature_selection_k = 30

[model]
architecture = "feature_attention"
conv_channels = 48
kernel_sizes = [3, 5, 7]
lstm_hidden = 96
lstm_layers = 1
attention_heads = 4
dense_hidden = 128
dropout = 0.25

[training]
epochs = 40
batch_size = 512
learning_rate = 0.001
weight_decay = 0.0001
early_stopping_patience = 8
class_weight = false
loss = "focal"
focal_gamma = 2.0
label_smoothing = 0.0

[output]
run_dir = "runs/proposed_feature_attention_balanced10k_mi30_focal"
